<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Fe · Zone KPI Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:light;
  --or:#F66B21; --or-soft:#FFF1E8; --ink:#1F2937; --ink2:#4B5563; --mute:#9CA3AF;
  --line:#ECE7E2; --bg:#FAF7F4; --card:#FFFFFF;
  --good:#15803D; --good-bg:#DCFCE7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --bud:#0EA5E9; --ly:#94A3B8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sarabun',sans-serif;background:#F3EEE9;color:var(--ink)}
/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:10px 16px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:6px}
.logo img{width:100%;height:100%;display:block}
.logo{width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;text-align:center;font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab.on{border-color:var(--or);color:var(--ink);background:var(--or-soft)}
.sp{flex:1}
button,input,select,textarea{font-family:inherit}
select,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;color:var(--ink)}
.btn{cursor:pointer;font-weight:600}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.status{font-size:12px;color:var(--ink2)}
/* ---------- stage ---------- */
#viewport{display:flex;justify-content:center;padding:10px;overflow:auto;background:#F3EEE9}
#stageWrap{position:relative}
#stage{width:var(--sw,1600px);transform-origin:top left}
.slide{width:var(--sw,1600px);min-height:900px;background:linear-gradient(160deg,#FFF6EF 0%,#FAF7F4 45%,#F6F4F8 100%);
  padding:36px 48px 30px;display:flex;flex-direction:column;gap:18px;font-family:'Sarabun',sans-serif}
.s-head{display:flex;align-items:flex-start;justify-content:space-between}
.s-kicker{font-size:15px;font-weight:600;color:var(--or);letter-spacing:.02em}
.s-title{font-size:38px;font-weight:800;margin-top:2px}
.s-meta{display:flex;align-items:center;gap:14px}
.s-meta .chip{font-size:15px;font-weight:600;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.s-meta .logo{width:54px;height:54px;border-radius:12px;font-size:12px}
.cards{display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(120,80,40,.06)}
.c-lab{font-size:14px;color:var(--ink2);font-weight:600}
.c-val{font-size:34px;font-weight:800;margin:4px 0 8px;white-space:nowrap}
.c-val small{font-size:16px;font-weight:600;color:var(--ink2);margin-left:4px}
.c-sub{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.c-sub div{display:flex;align-items:center;gap:6px}
.card.dark{background:#1E2230;color:#fff}
.card.dark .c-lab,.card.dark .c-sub,.card.dark .c-val small{color:#C9CDD8}
.b{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b.g{background:var(--good-bg);color:var(--good)} .b.r{background:var(--bad-bg);color:var(--bad)} .b.n{background:#EEF0F3;color:#4B5563}
.body{display:flex;flex-direction:column;gap:16px}
.body .panel.chart{height:380px}
.panel{background:var(--card);border-radius:18px;padding:16px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(120,80,40,.06);display:flex;flex-direction:column;min-height:0}
.p-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.p-title:before{content:"";width:4px;height:18px;border-radius:2px;background:var(--or)}
.p-title .sub{font-size:12.5px;font-weight:500;color:var(--mute);margin-left:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
.chartbox{flex:1;position:relative;min-height:0;margin-top:4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;table-layout:fixed}
col.c-name{width:300px}
tbody tr:nth-child(even) td{background:#FBF9F7}
td.hl{font-weight:700}
.cb{position:relative;display:inline-block;min-width:110px;padding-bottom:7px}
.cb i{position:absolute;left:0;bottom:0;height:5px;border-radius:3px;background:#F66B21;opacity:.75}
.cb i.neg{background:#DC2626}
.pill{display:inline-block;min-width:64px;padding:3px 10px;border-radius:8px;font-weight:700}
.pill.g{background:#DCFCE7;color:#15803D}.pill.y{background:#FEF3C7;color:#B45309}.pill.r{background:#FEE2E2;color:#B91C1C}
th{font-size:13.5px;color:var(--ink2);font-weight:700;text-align:center;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap;background:#F8F5F2}
th:first-child,td:first-child{text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis}
td{padding:8px 8px;text-align:center;border-bottom:1px solid #F4F1EE;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;background:#FFF6EF}
td .b{font-size:12px}
.summary{background:#fff;border:1px solid #FBD9C4;border-left:5px solid var(--or);border-radius:12px;padding:12px 16px;font-size:16px;color:var(--ink)}
.summary b{color:var(--or)}
.mix{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;margin:8px 0 8px}
.mix div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:var(--ink2);gap:12px;text-align:center}
.present .bar{display:none}
body.present{overflow:hidden;background:#15171F}
body.present #viewport{position:fixed;inset:0;padding:0;background:#15171F;align-items:center;overflow:hidden}
body.present #stage{cursor:pointer}
.pnav{position:fixed;right:18px;bottom:16px;z-index:30;display:none;gap:6px;align-items:center;background:rgba(20,22,30,.78);padding:6px;border-radius:12px}
body.present .pnav{display:flex}
.pnav button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:7px 12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.pnav span{color:#fff;font-size:14px;font-weight:700;padding:0 8px}
.landing{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#FFF6EF,#FAF7F4 50%,#F3EEE9);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:56px 20px}
.landing h1{font-size:34px;font-weight:800;margin:16px 0 6px} .landing p{color:var(--ink2);font-size:16px;margin:0 0 28px}
.amgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;width:100%;max-width:1000px}
.amcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(120,80,40,.06)}
.amcard:hover{border-color:var(--or);box-shadow:0 6px 22px rgba(246,107,33,.18)}
.amcard{display:flex;gap:16px;align-items:center}
.amph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#F3EEE9;flex:none;border:3px solid var(--or-soft)}
.amcard{color:var(--ink)}
.amcard b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.2}
.amcard span{display:block;color:var(--ink2);font-size:15.5px;margin-top:2px}
.amcard span.br{font-size:14px;color:var(--mute)}
.amcard em{display:inline-block;margin-top:10px;font-style:normal;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.amcard em.ok{background:var(--good-bg);color:var(--good)} .amcard em.no{background:#EEF0F3;color:#6B7280}
.pinbox{position:fixed;inset:0;z-index:50;background:rgba(20,22,30,.45);display:none;align-items:center;justify-content:center}
.pinbox.on{display:flex}
.pincard{color:var(--ink);background:#fff;border-radius:18px;padding:26px 28px;width:340px;text-align:center}
.pincard input{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;margin:14px 0 6px}
.pincard input:focus{outline:none;border-color:var(--or)}
.pinerr{color:var(--bad);font-size:13px;min-height:18px}
.amchip{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--or-soft);color:var(--ink)}
body.locked .bar,body.locked #viewport{visibility:hidden}
.adm{display:none} body.isadmin .adm{display:inline-flex}
.admlink{margin-top:26px;background:none;border:1px dashed #D8CFC6;border-radius:12px;padding:10px 18px;color:var(--ink2);font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1E2230;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:20}
</style>
</head>

/* ================= อ่าน Excel ================= */
function cellNum(ws, r, c){
  const cell = ws[XLSX.utils.encode_cell({r, c})];
  if(!cell || cell.t === 'e' || cell.v === '' || cell.v == null) return null;
  if(cell.t === 'n') return isFinite(cell.v) ? cell.v : null;
  const n = parseFloat(String(cell.v).replace(/,/g,''));
  return isFinite(n) ? n : null;
}
function parseWorkbook(wb){
  const branches = [];
  let zoneName = '', year = 2026;
  const meta = (wb.Workbook && wb.Workbook.Sheets) || [];
  wb.SheetNames.forEach((name, idx) => {
    const ws = wb.Sheets[name];
    const hidden = meta[idx] && meta[idx].Hidden;
    const a1 = ws['A1'] ? String(ws['A1'].v) : '';
    const a2 = ws['A2'] ? String(ws['A2'].v) : '';
    const y = a1.match(/(20\d\d)/); if(y) year = +y[1];
    if(/^zone$/i.test(name.trim())){ zoneName = a2.replace(/^Zone\s*:\s*/i,'').replace(/\s+/g,' ').trim(); return; }
    // ชื่อชีทสาขา: 5003 หรือย่อเป็น 18 / 12. (= 5018 / 5012) · ชีทที่ซ่อนไว้ไม่นับ
    let code = name.trim().replace(/\.$/,'');
    if(!/^\d{1,4}$/.test(code) || hidden) return;
    if(code.length<=2) code = '50'+code.padStart(2,'0');
    const v = {};
    for(const [k,row] of Object.entries(ROWS)){
      v[k] = []; for(let m=0;m<12;m++) v[k].push(cellNum(ws, row-1, 3+m));
    }
    if(!v.sales.some(x => x)) return;            // สาขาที่ไม่มียอดขาย (ปิด/ซ่อน) ข้ามไป
    const rgm = a2.split(':').slice(1).join(':').replace(/\s+/g,' ').trim();
    branches.push({code, rgm, v});
  });
  if(!branches.length) throw new Error('ไม่พบชีทสาขา (ชื่อชีทเป็นรหัส 4 หลัก เช่น 5003)');
  branches.sort((a,b)=>a.code.localeCompare(b.code));
  return {zoneName: zoneName || 'Zone', year, branches};
}

/* ================= คำนวณ ================= */
const SUMS = ['sales','salesBud','salesLY','be','ebitda','ebitdaBud','ebitdaLY','cust','custPlan','custLY',
  'trans','transPlan','transLY','colB','colBLY','hr','hrPlan','staff','staffPlan','cmp','voc'];
const WEIGHTED = ['cos','cosBud','colBud','dine','deli','take','waste'];  // ถ่วงด้วยยอดขาย
const AVGS = ['cem','oss','sda','csat','nps'];
/* รวมค่าของสาขา × เดือน ที่เลือก */
function calc(blist, months){
  const o = {}; SUMS.forEach(k=>o[k]=null);
  const w = {}; WEIGHTED.forEach(k=>w[k]=[0,0]);
  const a = {}; AVGS.forEach(k=>a[k]=[]);
  // ยอดปีนี้เฉพาะเดือนที่ปีก่อนมีข้อมูล (ใช้เทียบ YoY ให้แฟร์กับสาขาที่เพิ่งเปิดปีก่อน)
  const LYP={sales:'salesLY',trans:'transLY',cust:'custLY',ebitda:'ebitdaLY',colB:'colBLY'}; o.ss={}; const LYK=new Set(Object.values(LYP));
  for(const b of blist) for(const m of months){
    const V = b.v;
    // เดือนที่ปีก่อนยังไม่เปิดเต็มเดือน (ยอดปีก่อน < 50% ของปีนี้ เช่น เดือนที่เพิ่งเปิดสาขา) ไม่นำมาเทียบ YoY
    const cmp = V.sales[m]==null || (V.salesLY[m]!=null && V.salesLY[m] >= .5*V.sales[m]);
    SUMS.forEach(k=>{ const x=V[k][m]; if(x==null) return; if(!cmp && LYK.has(k)) return; o[k]=(o[k]||0)+x; });
    if(cmp) for(const [k,ly] of Object.entries(LYP)){ if(V[k][m]!=null && V[ly][m]!=null) o.ss[k]=(o.ss[k]||0)+V[k][m]; }
    const wt = V.sales[m] || V.salesBud[m] || 0;
    WEIGHTED.forEach(k=>{ const x=V[k][m]; if(x!=null && wt){ w[k][0]+=x*wt; w[k][1]+=wt; } });
    AVGS.forEach(k=>{ const x=V[k][m]; if(x!=null) a[k].push(x); });
  }
  // พนักงานเป็นจำนวนคน ไม่ใช่ยอดสะสม → ช่วงหลายเดือนให้เฉลี่ยต่อเดือน
  ['staff','staffPlan'].forEach(k=>{ const per=months.map(m=>blist.reduce((s,b)=>s+(b.v[k][m]||0),0)).filter(x=>x>0);
    o[k]= per.length ? per.reduce((s,x)=>s+x,0)/per.length : null; });
  WEIGHTED.forEach(k=>o[k]= w[k][1] ? w[k][0]/w[k][1] : null);
  AVGS.forEach(k=>o[k]= a[k].length ? a[k].reduce((s,x)=>s+x,0)/a[k].length : null);
  const d = (x,y)=> (x!=null && y) ? x/y : null;
  o.ticket=d(o.sales,o.trans); o.ticketLY=d(o.salesLY,o.transLY);
  o.pc=d(o.sales,o.cust); o.pcLY=d(o.salesLY,o.custLY); o.cpb=d(o.cust,o.trans);
  o.colPct=d(o.colB,o.sales); o.prodS=d(o.sales,o.hr); o.prodT=d(o.trans,o.hr);
  o.margin=d(o.ebitda,o.sales); o.beGap=(o.sales!=null&&o.be!=null)?o.sales-o.be:null;
  o.has = o.sales!=null;
  return o;
}

/* ================= รูปแบบตัวเลข ================= */
const nf = (x,d=0)=> x==null||!isFinite(x) ? '—' : x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const M = x => { if(x==null) return '—'; const a=Math.abs(x), sg=x<0?'−':''; return sg+(a>=1e6 ? '฿'+nf(a/1e6,2)+'M' : a>=1e3 ? '฿'+nf(a/1e3,0)+'K' : '฿'+nf(a,0)); };
const MA = x => { const a=Math.abs(x), sg=x<0?'−':''; return sg+(a>=1e6 ? '฿'+nf(a/1e6,1)+'M' : a>=1e3 ? '฿'+nf(a/1e3,0)+'K' : '฿'+nf(a,0)); };
const P = (x,d=1)=> x==null ? '—' : nf(x*100,d)+'%';
/* badge: เปลี่ยนแปลง % (a เทียบ b) */
function bPct(a,b,inverse=false){
  if(a==null||!b) return '<span class="b n">—</span>';
  const r=a/b-1, good = inverse ? r<=0 : r>=0;
  return `<span class="b ${good?'g':'r'}">${r>=0?'▲':'▼'} ${nf(Math.abs(r)*100,1)}%</span>`;
}
/* badge: ผลต่างเป็น ppt (สำหรับค่าที่เป็น %) */
function bPpt(a,b,inverse=false){
  if(a==null||b==null) return '<span class="b n">—</span>';
  const r=(a-b)*100, good = inverse ? r<=0 : r>=0;
  return `<span class="b ${good?'g':'r'}">${r>=0?'▲':'▼'} ${nf(Math.abs(r),1)} ppt</span>`;
}
/* badge: ผลต่างจำนวน */
function bDiff(a,b,fmt,inverse=false){
  if(a==null||b==null) return '<span class="b n">—</span>';
  const r=a-b, good = inverse ? r<=0 : r>=0;
  return `<span class="b ${good?'g':'r'}">${r>=0?'+':'−'}${fmt(Math.abs(r))}</span>`;
}

function pill(v,txt,good,warn){ if(v==null) return '—'; const c= v>=good?'g': (warn!=null&&v>=warn?'y':'r'); return `<span class="pill ${c}">${txt}</span>`; }
function rel(a,b,what){ if(a==null||!b) return `ไม่มีข้อมูล${what}`; const r=a/b-1; return `${r>=0?'สูงกว่า':'ต่ำกว่า'}${what} <b>${nf(Math.abs(r)*100,1)}%</b>`; }
function pptTxt(a,b){ if(a==null||b==null) return '—'; const r=(a-b)*100; return `${r>=0?'+':'−'}${nf(Math.abs(r),1)} ppt`; }

let chart = null;
function cardHTML(c){
  if(c.mix){
    const tot=c.mix.reduce((s,x)=>s+(x[1]||0),0)||1;
    return `<div class="card"><div class="c-lab">${c.lab}</div>
      <div class="mix">${c.mix.map(x=>`<div style="width:${(x[1]||0)/tot*100}%;background:${x[2]}">${(x[1]||0)/tot>.08?P(x[1],0):''}</div>`).join('')}</div>
      <div class="c-sub">${c.mix.map(x=>`<div><span style="width:9px;height:9px;border-radius:2px;background:${x[2]};display:inline-block"></span>${x[0]} <b style="margin-left:auto;color:var(--ink)">${P(x[1])}</b></div>`).join('')}</div></div>`;
  }
  return `<div class="card ${c.dark?'dark':''}"><div class="c-lab">${c.lab}</div>
    <div class="c-val">${c.val}${c.unit?`<small>${c.unit}</small>`:''}</div>
    <div class="c-sub">${(c.sub||[]).map(s=>`<div>${s[0]} ${s[1]?'<span style="margin-left:auto">'+s[1]+'</span>':''}</div>`).join('')}</div></div>`;
}
function tableRows(){
  const m=state.month;
  if(state.scope==='ZONE'){
    const rows=DATA.branches.map(b=>({label:bName(b.code), code:b.code, o:calc([b],period())}));
    return {head:'สาขา', total:{label:'รวมโซน', o:calc(DATA.branches,period())}, rows};
  }
  const b=scopeBranches();
  const rows=[]; for(let i=0;i<=m;i++) rows.push({label:MONTHS[i], o:calc(b,[i])});
  return {head:'เดือน', total:{label:'YTD', o:calc(b,[...Array(m+1).keys()])}, rows};
}
function cell(c,o,rows){
  if(!c[2]) return c[1](o);
  const v=c[2](o); if(v==null) return '—';
  const mx=Math.max(...rows.map(r=>Math.abs(c[2](r.o)||0)))||1;
  return `<span class="cb">${c[1](o)}<i class="${v<0?'neg':''}" style="width:${Math.abs(v)/mx*100}%"></i></span>`;
}
function render(){
  const S=SLIDES[state.slide], m=state.month, b=scopeBranches();

  const mo = periodLabel();
  const T=tableRows();
  const cards=S.cards(o);
  document.getElementById('stage').innerHTML = `
  <div class="slide" id="slide">

      <div><div class="s-kicker">${state.slide+1} / ${SLIDES.length} · ${S.th}</div><div class="s-title">${S.title}</div></div>
      <div class="s-meta"><span class="chip">${scopeLabel}</span><span class="chip">${mo}</span></div>
    </div>
    <div class="cards" style="grid-template-columns:repeat(${cards.length},1fr)">${cards.map(cardHTML).join('')}</div>
    <div class="body">
      <div class="panel chart">
        <div class="p-title">${S.chart.title}<span class="sub">${S.chart.unit} · ม.ค.–ธ.ค. ${DATA.year}</span></div>
        <div class="legend">${S.chart.lines.map(l=>`<span><i class="${l[3]?'d':''}" style="border-color:${l[2]}"></i>${l[1]}</span>`).join('')}</div>
        <div class="chartbox"><canvas id="cv" width="700" height="400"></canvas></div>
      </div>
      <div class="panel">
        <div class="p-title">${state.scope==='ZONE'?'รายสาขา · '+(state.ytd?'ม.ค.–'+MONTHS[m]+' (YTD)':MONTHS[m]):'รายเดือน · ม.ค.–'+MONTHS[m]}</div>
        <div style="overflow:hidden"><table>
          <colgroup><col class="c-name">${S.cols.map(()=>'<col>').join('')}</colgroup>
          <thead><tr><th>${T.head}</th>${S.cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead>
          <tbody><tr class="tot"><td>${T.total.label}</td>${S.cols.map(c=>`<td>${c[1](T.total.o)}</td>`).join('')}</tr>
          ${T.rows.map(r=>`<tr><td>${r.label}</td>${S.cols.map(c=>`<td${c[2]?' class="hl"':''}>${r.o.has||S.key==='Audit'?cell(c,r.o,T.rows):'—'}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>
    <div class="summary"><b>สรุป:</b> ${S.summary(o, state.ytd?`ม.ค.–${MONTHS[m]}`:MONTHS_FULL[m], T.rows)}</div>
  </div>`;
  drawChart(S);
  fit();
}
function drawChart(S){
  if(chart){ chart.destroy(); chart=null; }
  const cv=document.getElementById('cv'), box=cv.parentElement;
  cv.width=box.clientWidth; cv.height=box.clientHeight;
  const m=state.month;
  const datasets=S.chart.lines.map(([key,label,color,dash])=>{
    let data = key==='csatP' ? series('csat').map(x=>x==null?null:x/100) : series(key);
    if(!dash) data=data.map((x,i)=>i<=m?x:null);       // ปีนี้แสดงถึงเดือนที่เลือก
    return {label,data,borderColor:color,backgroundColor:color,borderWidth:dash?2:3,borderDash:dash?[6,5]:[],
      pointRadius:dash?0:4,pointBackgroundColor:'#fff',pointBorderWidth:2,spanGaps:true,tension:.25};
  });
  const selPlugin={id:'sel',
    beforeDatasetsDraw(c){ if(state.ytd) return; const x=c.scales.x.getPixelForValue(m), w=c.scales.x.width/12, a=c.chartArea, ctx=c.ctx;
      ctx.save(); ctx.fillStyle='rgba(246,107,33,.08)'; ctx.fillRect(x-w/2,a.top,w,a.bottom-a.top); ctx.restore(); },
    afterDatasetsDraw(c){ const ctx=c.ctx; ctx.save(); ctx.font='700 13px "Sarabun"'; ctx.textAlign='center';
      c.data.datasets.forEach((ds,i)=>{ if(ds.borderDash.length) return; const p=c.getDatasetMeta(i).data[m]; const v=ds.data[m]; if(!p||v==null) return;
        ctx.fillStyle=ds.borderColor; ctx.fillText(S.chart.fmt(v),p.x,p.y-12); }); ctx.restore(); }};
  chart=new Chart(cv,{type:'line',data:{labels:MONTHS,datasets},plugins:[selPlugin],
    options:{responsive:false,animation:false,devicePixelRatio:3,maintainAspectRatio:false,
      layout:{padding:{top:24,right:16,bottom:4}},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${S.chart.fmt(c.parsed.y)}`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#6B7280',font:{family:'Sarabun',size:13}}},
        y:{grace:'8%',grid:{color:'#F1ECE7'},border:{display:false},ticks:{color:'#9CA3AF',font:{family:'Sarabun',size:12},callback:v=>(S.chart.axis||S.chart.fmt)(v)}}}}});
}
function fit(){
  const wrap=document.getElementById('stageWrap'), st=document.getElementById('stage');
  const pres=document.body.classList.contains('present');
  const sl=document.getElementById('slide');
  let s, W=1600;
  if(pres){
    // โหมดพรีเซนต์: ขยายความกว้างสไลด์ให้ตรงสัดส่วนจอ แล้วย่อให้พอดีทั้งสองแกน (ไม่เหลือขอบดำ)
    const vw=window.innerWidth, vh=window.innerHeight;
    if(sl) sl.style.minHeight='0';
    s=vh/st.offsetHeight;
    for(let i=0;i<4;i++){
      W=Math.max(1600, Math.round(vw/s));
      document.documentElement.style.setProperty('--sw',W+'px');
      const ns=vh/st.offsetHeight;
      if(Math.abs(ns-s)<0.001){ s=ns; break; }
      s=ns;
    }
    W=Math.max(1600, Math.round(vw/s));
    document.documentElement.style.setProperty('--sw',W+'px');
    if(sl) sl.style.minHeight=Math.ceil(vh/s)+'px';           // เนื้อหาสั้นกว่าจอ → ยืดพื้นหลังให้เต็ม
    s=Math.min(vw/W, vh/st.offsetHeight);
  } else {
    document.documentElement.style.setProperty('--sw','1600px');
    if(sl) sl.style.minHeight='';
    s=(document.getElementById('viewport').clientWidth-20)/1600;                     // ปกติ: เต็มความกว้าง เลื่อนลงดูได้
  }
  st.style.transform=`scale(${s})`; wrap.style.width=W*s+'px'; wrap.style.height=st.offsetHeight*s+'px';
  const n=document.getElementById('pNum'); if(n) n.textContent=`${state.slide+1} / ${SLIDES.length}`;
}

  const sc=document.getElementById('scope');

function setSlide(i){ state.slide=(i+SLIDES.length)%SLIDES.length;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===state.slide)); render(); }
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) setSlide(+t.dataset.i);});
document.getElementById('scope').addEventListener('change',e=>{state.scope=e.target.value; render();});
document.getElementById('month').addEventListener('change',e=>{ if(e.target.value==='ytd'){state.ytd=true; state.month=state.lastData;} else {state.ytd=false; state.month=+e.target.value;} render();});
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||!DATA) return;
  if(e.key==='Escape' && document.body.classList.contains('present')) stopPresent();
  if(e.key===' ' && document.body.classList.contains('present')){ e.preventDefault(); setSlide(state.slide+1); }
  if(e.key==='ArrowRight'||e.key==='PageDown') setSlide(state.slide+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') setSlide(state.slide-1); });
window.addEventListener('resize',()=>fit());
document.addEventListener('fullscreenchange',()=>DATA&&setTimeout(fit,50));
async function startPresent(){
  document.body.classList.add('present'); fit();
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}   // ถ้าเบราว์เซอร์ไม่ให้เต็มจอ ก็ยังพรีเซนต์ในหน้าต่างได้
}
async function stopPresent(){
  document.body.classList.remove('present');
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
  fit();
}
document.getElementById('fs').addEventListener('click',startPresent);
document.getElementById('pExit').addEventListener('click',e=>{e.stopPropagation(); stopPresent();});
document.getElementById('pPrev').addEventListener('click',e=>{e.stopPropagation(); setSlide(state.slide-1);});
document.getElementById('pNext').addEventListener('click',e=>{e.stopPropagation(); setSlide(state.slide+1);});
document.getElementById('stage').addEventListener('click',()=>{ if(document.body.classList.contains('present')) setSlide(state.slide+1); });
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')) stopPresent(); });

function toast(t,ms=2600){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',ms); }

// ข้อมูลที่แอดมินนำเข้า เก็บในเบราว์เซอร์ของแอดมิน (ใช้ได้จนกว่าจะเปิดไฟล์เว็บเวอร์ชันใหม่)

  if(o && o.stamp===EMBED_STAMP) Object.assign(EMBED,o.zones); }catch(e){} })();
function saveOverrides(changed){ try{ const o=JSON.parse(localStorage.getItem('zoneKpi_admin')||'null');
  const zones=(o&&o.stamp===EMBED_STAMP)?o.zones:{}; Object.assign(zones,changed);
  localStorage.setItem('zoneKpi_admin',JSON.stringify({stamp:EMBED_STAMP,zones})); }catch(e){} }
const DATA_CTRLS=['scope','month','saveOne','saveAll','fs'];
function showEmpty(msg){
  DATA=null; DATA_CTRLS.forEach(id=>document.getElementById(id).style.display='none'); if(chart){chart.destroy(); chart=null;}
  ['tabs','scope','month'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('stage').innerHTML=`<div class="empty" style="width:1600px;height:600px">${msg}</div>`; fit();
}
function showData(d){
  DATA=d; DATA_CTRLS.forEach(id=>document.getElementById(id).style.display='');
  let last=0; for(let m=0;m<12;m++) if(DATA.branches.some(b=>b.v.sales[m])) last=m;
  state.month=last; state.lastData=last; state.ytd=false; state.scope='ZONE';
  buildControls(); render();
}
function adminData(){
  const z=document.getElementById('zoneSel').value||'ALL';
  const keys = z==='ALL' ? AMS.map(a=>a.key) : [z];
  const parts=keys.map(k=>EMBED[k]).filter(Boolean);
  if(!parts.length) return null;
  return {zoneName: z==='ALL'?'ทุกโซน':AMS.find(a=>a.key===z).nick, year:parts[0].year, branches:[].concat(...parts.map(p=>p.branches))};
}
function openZone(){
  if(AM.admin){
    const zs=document.getElementById('zoneSel'), cur=zs.value||'ALL';
    zs.innerHTML='<option value="ALL">ทุกโซน</option>'+AMS.map(a=>`<option value="${a.key}">${a.nick}${EMBED[a.key]?'':' (ไม่มีข้อมูล)'}</option>`).join('');
    zs.value=cur;
    const d=adminData();
    if(d) showData(JSON.parse(JSON.stringify(d))); else showEmpty('ยังไม่มีข้อมูล<br>กด “นำเข้า Excel” เพื่อเพิ่มไฟล์ KPI (เลือกได้หลายไฟล์พร้อมกัน)');
    return;
  }
  const d=EMBED[AM.key];
  if(d) showData(JSON.parse(JSON.stringify(d)));
  else showEmpty(`โซน${AM.nick}ยังไม่มีข้อมูล`);
}

/* ---------- หน้าเลือก AM + รหัส ---------- */
let pending=null;
function renderLanding(){
  document.getElementById('amGrid').innerHTML=AMS.map(a=>`<button class="amcard" data-k="${a.key}"><img class="amph" src="${AM_PHOTOS[a.key]||''}" alt=""><div><b>${a.nick}</b><span>${a.name}</span><span class="br">${a.codes.length} สาขา</span>${EMBED[a.key]?'<em class="ok">มีข้อมูล</em>':'<em class="no">ยังไม่มีข้อมูล</em>'}</div></button>`).join('');
}
document.getElementById('amGrid').addEventListener('click',e=>{
  const c=e.target.closest('.amcard'); if(!c) return;
  pending=AMS.find(a=>a.key===c.dataset.k);
  document.getElementById('pinName').textContent=pending.nick+' · '+pending.name; document.getElementById('pinPhoto').src=AM_PHOTOS[pending.key]||''; document.getElementById('pinPhoto').style.display='';
  document.getElementById('pinErr').textContent=''; const i=document.getElementById('pinInput'); i.value='';
  document.getElementById('pinBox').classList.add('on'); setTimeout(()=>i.focus(),50);
});
document.getElementById('adminBtn').addEventListener('click',()=>{
  pending=ADMIN; document.getElementById('pinName').textContent='ผู้ดูแลระบบ (Admin)'; document.getElementById('pinPhoto').style.display='none';
  document.getElementById('pinErr').textContent=''; const i=document.getElementById('pinInput'); i.value='';
  document.getElementById('pinBox').classList.add('on'); setTimeout(()=>i.focus(),50);
});
function tryPin(){
  const v=document.getElementById('pinInput').value.trim();
  if(v!==pending.pin){ document.getElementById('pinErr').textContent='รหัสไม่ถูกต้อง'; return; }
  document.getElementById('pinBox').classList.remove('on');
  enterAm(pending);
}
function enterAm(a){
  AM=a; try{ sessionStorage.setItem('zoneKpiAm',a.key); }catch(e){}
  document.body.classList.toggle('isadmin',!!a.admin);
  document.getElementById('amChip').textContent=a.nick;
  document.getElementById('landing').style.display='none'; document.body.classList.remove('locked');
  openZone();
}
document.getElementById('pinOk').addEventListener('click',tryPin);
document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
document.getElementById('pinCancel').addEventListener('click',()=>document.getElementById('pinBox').classList.remove('on'));
document.getElementById('switchAm').addEventListener('click',()=>{
  AM=null; DATA=null; document.body.classList.remove('isadmin'); try{ sessionStorage.removeItem('zoneKpiAm'); }catch(e){}
  document.body.classList.add('locked'); document.getElementById('landing').style.display='flex'; renderLanding();
});

/* ---------- แอดมิน: นำเข้า Excel (หลายไฟล์) แยกสาขาเข้าโซนตามรหัสสาขา ---------- */
document.getElementById('zoneSel').addEventListener('change',()=>openZone());
document.getElementById('file').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length||!AM||!AM.admin) return;
  // รวมทุกไฟล์ก่อน: สาขาเดียวกันที่อยู่หลายไฟล์ (เช่น ย้ายโซนกลางปี) เอาค่าแต่ละเดือนมารวมกัน
  const all={}, msgs=[], unknown=new Set(); let year=null;
  const mergeInto=(t,b)=>{ for(const k in b.v) b.v[k].forEach((x,m)=>{ if(x!=null) t.v[k][m]=x; }); if(b.rgm) t.rgm=b.rgm; };
  for(const z of Object.values(EMBED)) for(const b of z.branches) all[b.code]=JSON.parse(JSON.stringify(b));
  for(const f of files){
    try{
      const d=parseWorkbook(XLSX.read(await f.arrayBuffer(),{type:'array'})); year=d.year;
      for(const b of d.branches){ if(all[b.code]) mergeInto(all[b.code],b); else all[b.code]=b; }
      msgs.push(`${f.name.replace(/\.xlsx?$/i,'')}: ${d.branches.length} สาขา`);
    }catch(err){ msgs.push(`${f.name}: อ่านไม่ได้ (${err.message})`); }
  }
  const changed={};
  for(const a of AMS){
    const mine=Object.values(all).filter(b=>a.codes.includes(b.code)).sort((x,y)=>x.code.localeCompare(y.code));
    if(mine.length) changed[a.key]={zoneName:a.nick+' '+a.name, year:year||mine[0].year||2026, branches:mine};
  }
  Object.keys(all).filter(c=>!AMS.some(a=>a.codes.includes(c))).forEach(c=>unknown.add(c));
  Object.assign(EMBED,changed); saveOverrides(changed); openZone();
  toast('นำเข้าแล้ว: '+(msgs.join(' · ')||'ไม่พบสาขา')+(unknown.size?` · ไม่อยู่ในรายชื่อโซน (ไม่แสดง): ${[...unknown].join(', ')}`:'')+' — กด “ดาวน์โหลดไฟล์เว็บ” แล้วอัปขึ้น GitHub เพื่อให้ทุกคนเห็น',9000);
});
document.getElementById('dlHtml').addEventListener('click',async()=>{
  const stamp=new Date().toISOString();
  let html=PAGE_SRC;
  const i=html.indexOf('const EMBED = '), j=html.indexOf('\n',i);
  html=html.slice(0,i)+'const EMBED = '+JSON.stringify(EMBED)+';'+html.slice(j);
  html=html.replace(/const EMBED_STAMP = "[^"]*";/,'const EMBED_STAMP = "'+stamp+'";');
  html=html.replace('<body class="locked">','<body class="locked">');
  if(await saveFile('index.html', new Blob([html],{type:'text/html'}))) toast('ได้ไฟล์ index.html แล้ว — อัปทับไฟล์เดิมบน GitHub',6000);
});

/* ---------- บันทึกรูป ---------- */
let dlCap=null;
if(window.claude && window.claude.use){ window.claude.use('downloads').then(x=>dlCap=x).catch(()=>{}); }
async function saveFile(name, blob){
  if(dlCap){ try{ await dlCap.save({filename:name, data:blob}); return true; }
    catch(e){ if(e&&e.code==='declined') return false; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return true;
}
async function captureSlide(){
  await document.fonts.ready;
  const st=document.getElementById('stage'), prev=st.style.transform;
  st.style.transform='none';
  try{
    const c=await html2canvas(document.getElementById('slide'),{scale:2,backgroundColor:'#FAF7F4',logging:false});
    return await new Promise(r=>c.toBlob(r,'image/png'));
  } finally { st.style.transform=prev; }
}
const fileBase=()=>`KPI_${state.scope==='ZONE'?'Zone':state.scope}_${DATA.year}-${state.ytd?'YTD-'+String(state.month+1).padStart(2,'0'):String(state.month+1).padStart(2,'0')}`;
async function busy(fn){ const bs=[...document.querySelectorAll('#saveOne,#saveAll')]; bs.forEach(b=>b.disabled=true);
  try{ await fn(); } catch(e){ toast('บันทึกไม่สำเร็จ: '+(e.message||e),5000); } finally{ bs.forEach(b=>b.disabled=false); } }
document.getElementById('saveOne').addEventListener('click',()=>busy(async()=>{
  const blob=await captureSlide(); const S=SLIDES[state.slide];
  if(await saveFile(`${fileBase()}_${state.slide+1}-${S.key}.png`, blob)) toast('บันทึกรูปแล้ว');
}));
document.getElementById('saveAll').addEventListener('click',()=>busy(async()=>{
  const zip=new JSZip(), keep=state.slide;
  for(let i=0;i<SLIDES.length;i++){ state.slide=i; render(); toast(`กำลังสร้างรูป ${i+1}/${SLIDES.length}…`,60000);
    zip.file(`${fileBase()}_${i+1}-${SLIDES[i].key}.png`, await captureSlide()); }
  setSlide(keep);
  const blob=await zip.generateAsync({type:'blob'});
  if(await saveFile(`${fileBase()}_all-slides.zip`, blob)) toast('บันทึกครบ 5 รูป (ไฟล์ .zip)');
}));
